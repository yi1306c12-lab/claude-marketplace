services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/javascript-node:26-trixie
    volumes:
      - type: bind
        source: ..
        target: /workspace
      - type: volume
        source: claude-config
        target: /home/node/.claude
      - type: volume
        source: gh-config
        target: /home/node/.config/gh
    command: sleep infinity
    environment:
      CLAUDE_CONFIG_DIR: /home/node/.claude

volumes:
  claude-config:
  gh-config: