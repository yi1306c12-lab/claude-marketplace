name: Claude PR Review

on:
  issue_comment:
    types:
      - created

concurrency:
  group: pr-review-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    if: >-
      github.event.issue.pull_request &&
      github.actor == github.repository_owner &&
      contains(github.event.comment.body, '@claude-review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0
      - uses: anthropics/claude-code-action@9db594c7a0e82298c121c18b7f08aa1579ce7341 # v1.0.185
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugins: pr-review-toolkit@claude-plugins-official
          settings: ".github/claude/settings.json"
          additional_permissions: |
            actions:read
          claude_args: |
            --model sonnet
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            Review this PR using the specialized agents from pr-review-toolkit:

            1. Test coverage -> pr-test-analyzer
            2. Silent failures and error handling -> silent-failure-hunter
            3. Comment accuracy -> comment-analyzer

            The working tree is not the PR head. Use `gh pr diff` to obtain the changes.

            Do not change any code. Post your findings as a single PR comment.
            List the agent names you actually invoked at the top of the comment.