name: Claude PR Review

on:
  issue_comment:
    types:
      - created

concurrency:
  group: pr-review-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0
      - uses: anthropics/claude-code-action@9db594c7a0e82298c121c18b7f08aa1579ce7341 # v1.0.185
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugins: pr@yi1306c12-lab
          plugin_marketplaces: https://github.com/yi1306c12-lab/claude-marketplace.git
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(gh issue list:*)",
                  "Bash(gh issue view:*)",
                  "Bash(gh pr edit:*)",
                  "Bash(gh pr comment:*)",
                  "Bash(gh pr view:*)",
                  "Bash(gh pr list:*)",
                  "Bash(gh pr diff:*)",
                  "Bash(git log:*)",
                  "Bash(git diff:*)",
                  "Bash(git blame:*)",
                  "Bash(gh label list:*)",
                  "Bash(gh run view:*)",
                  "Bash(gh run list:*)",
                  "Write(tmp/**)",
                  "WebFetch",
                  "WebSearch"
                ]
              }
            }
          additional_permissions: |
            actions:read
          claude_args: |
            --model opus
          prompt: |
            Review pull request ${{ github.event.issue.number }} in repository ${{ github.repository }}.
