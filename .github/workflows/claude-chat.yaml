name: Claude Chat

on:
  issue_comment:
    types:
      - created

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  claude-chat:
    if: >-
      github.event.comment.user.type == 'User' &&
      contains(github.event.comment.body, '@claude')
    uses: yi1306c12-lab/claude-kit/.github/workflows/chat.yaml@main
    secrets: inherit